<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' mediastream:">
  <title>Desk Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hit" hidden>
      <button id="close" class="x" aria-label="Close">×</button>
      <div id="who"></div>
      <div id="text"></div>
      <div id="meter" hidden><i></i></div>
      <form id="form" hidden>
        <input id="input" type="text" placeholder="Ask me to move things around…" autocomplete="off">
      </form>
      <div id="actions" hidden>
        <button id="ok">Got it</button>
        <button id="snooze">Snooze 10 min</button>
      </div>
    </div>

    <div id="buddy" class="hit walk" title="Click to talk · right-click for menu">
      <div id="fx"><span class="z">z</span><span class="z">z</span><span class="bang">!</span><span class="dots"><i></i><i></i><i></i></span></div>
      <svg id="svg" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
        <g id="body">
          <!-- antenna -->
          <g class="antenna">
            <path class="rod" d="M60 21 L60 9" />
            <circle class="bulb" cx="60" cy="7" r="4.5" />
          </g>
          <!-- arms -->
          <rect class="arm armL" x="21" y="77" width="9" height="20" rx="4.5" />
          <rect class="arm armR" x="90" y="77" width="9" height="20" rx="4.5" />
          <!-- torso -->
          <rect class="neck" x="53" y="68" width="14" height="8" rx="2" />
          <rect class="torso" x="31" y="73" width="58" height="32" rx="11" />
          <path class="vent" d="M40 82 H50 M40 87 H50 M40 92 H50" />
          <circle class="chest" cx="73" cy="88" r="6" />
          <!-- head -->
          <circle class="bolt" cx="24" cy="44" r="5" />
          <circle class="bolt" cx="96" cy="44" r="5" />
          <rect class="head" x="26" y="20" width="68" height="50" rx="17" />
          <rect class="screen" x="34" y="27" width="52" height="36" rx="11" />
          <ellipse class="cheek" cx="41" cy="54" rx="4" ry="2.5" />
          <ellipse class="cheek" cx="79" cy="54" rx="4" ry="2.5" />
          <g id="eyes">
            <g class="eye" transform="translate(48 43)"><g class="pupil"><rect class="led" x="-5" y="-7" width="10" height="14" rx="5" /><rect class="shine" x="-3" y="-5" width="3" height="4" rx="1.5" /></g></g>
            <g class="eye" transform="translate(72 43)"><g class="pupil"><rect class="led" x="-5" y="-7" width="10" height="14" rx="5" /><rect class="shine" x="-3" y="-5" width="3" height="4" rx="1.5" /></g></g>
          </g>
          <path class="lids" d="M42 45 Q48 49 54 45 M66 45 Q72 49 78 45" />
          <path class="mouth smile" d="M55 54 Q60 58 65 54" />
          <rect class="mouth open" x="55" y="52" width="10" height="6" rx="3" />
        </g>
        <!-- feet -->
        <rect class="foot footL" x="38" y="104" width="18" height="9" rx="4.5" />
        <rect class="foot footR" x="64" y="104" width="18" height="9" rx="4.5" />
      </svg>
      <div id="shadow"></div>
    </div>
  </div>
  <script src="recorder.js"></script>
  <script src="buddy.js"></script>
</body>
</html>
